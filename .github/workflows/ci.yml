name: CI

on:
  push:
  pull_request:

jobs:
  # Given to you. Do not delete this job.
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # M3 — YOUR WORK STARTS HERE.
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # If your project uses Node.js later, uncomment these:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      # If your project uses Python later, uncomment these:
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'

      - run: make install
      - run: make test
      - run: make build

  # M4 — Docker/Jenkins section
  # docker:
  #   ...