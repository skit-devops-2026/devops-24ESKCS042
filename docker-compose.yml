# Blood Bank Management System - local orchestration
#
#   docker compose up --build
#   open http://localhost:8081
#
# The port mapping is not optional. Publishing "8081:80" is what makes the app inside
# the container reachable from the host browser; without it the app is running fine
# but listening on port 80 of the container's own private network, where the laptop
# cannot see it.

services:
  bloodbank:
    build:
      context: .
      dockerfile: Dockerfile
    image: bloodbank:latest
    container_name: bloodbank
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
