# Blood Bank Management System - Kubernetes Deployment
#
# Applies the container image published by the CI pipeline to GitHub Container
# Registry.
#
#   kubectl apply -f k8s/deployment.yaml
#   kubectl get pods
#
# Image tags
# ----------
# CI publishes two tags for every build:
#
#   ghcr.io/skit-devops-2026/bloodbank:<commit-sha>   immutable and traceable
#   ghcr.io/skit-devops-2026/bloodbank:latest          moving convenience tag
#
# This manifest pins `latest` with `imagePullPolicy: Always` so the cluster picks up the
# most recent successful build. To reproduce an exact build instead, replace the tag with
# a commit SHA and set `imagePullPolicy: IfNotPresent`. Pinning by SHA is preferable for
# anything that has to behave reproducibly; `latest` is only used here to keep the
# student demo from needing a manifest edit on every push.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bloodbank
  labels:
    app: bloodbank
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bloodbank
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bloodbank
    spec:
      containers:
        - name: bloodbank
          image: ghcr.io/skit-devops-2026/bloodbank:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            # Nginx needs to bind port 80. Everything else is dropped.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      securityContext:
        runAsNonRoot: false
